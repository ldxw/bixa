
name: 📦 构建并发布（按压缩后大小分卷）

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如：2.0.2）'
        required: true
      use_official:
        description: '是否使用官方发布包（来自 bixacloud 仓库）？'
        type: boolean
        required: false
        default: false
      max_size_mb:
        description: '单个 zip 包最大大小（MB，默认 10）'
        required: false
        default: '10'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 🧰 准备构建目录
        run: mkdir workspace

      - name: 🌐 下载并解压官方包（如果选择）
        if: ${{ github.event.inputs.use_official == 'true' }}
        run: |
          echo "✅ 使用官方包版本 v${{ github.event.inputs.version }}"
          curl -L "https://github.com/bixacloud/bixa/archive/refs/tags/v${{ github.event.inputs.version }}.zip" -o source.zip
          unzip source.zip -d workspace
          mv workspace/*/* workspace/

      - name: 📥 拉取当前仓库代码（默认）
        if: ${{ github.event.inputs.use_official != 'true' }}
        uses: actions/checkout@v4
        with:
          path: workspace

      - name: ⚙️ 安装 PHP 与 Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, zip, intl
          tools: composer

      - name: 📦 安装生产环境依赖（Composer）
        working-directory: workspace
        run: composer install --no-dev --optimize-autoloader

      - name: 🧹 清理并准备发布目录
        run: |
          mkdir release
          rsync -av --exclude='.git*' --exclude='tests' --exclude='.github' \
                    --exclude='composer.*' --exclude='*.lock' \
                    --exclude='vendor/bin' workspace/ release/

      - name: 🗜️ 分卷压缩（按实际 zip 大小控制）+ manifest
        run: |
          prefix="bixa-v${{ github.event.inputs.version }}-composer"
          output_dir="chunks/${prefix}"
          mkdir -p "$output_dir"
          cd release
          max=$((${GITHUB_EVENT_INPUTS_MAX_SIZE_MB:-10} * 1024 * 1024))
          manifest="../${output_dir}/manifest.txt"
          echo "" > "$manifest"
          i=1
          tmpzip="../${output_dir}/.tmp.zip"
          finalzip="../${output_dir}/${prefix}-${i}.zip"
          files=()
          for f in $(find . -type f | sort); do
            files+=("$f")
            zip -9 -q "$tmpzip" "${files[@]}"
            actual=$(stat -c%s "$tmpzip")
            if [ $actual -gt $max ]; then
              files=("${files[@]:0:${#files[@]}-1}")  # remove last
              zip -9 "$finalzip" "${files[@]}"
              echo "${prefix}-${i}.zip:" >> "$manifest"
              printf "  %s\n" "${files[@]}" >> "$manifest"
              i=$((i + 1))
              files=( "$f" )
            fi
            rm -f "$tmpzip"
          done
          if [ ${#files[@]} -gt 0 ]; then
            zip -9 "../${output_dir}/${prefix}-${i}.zip" "${files[@]}"
            echo "${prefix}-${i}.zip:" >> "$manifest"
            printf "  %s\n" "${files[@]}" >> "$manifest"
          fi
          cd ..

      - name: 🚀 发布 Release（按 zip 实际体积切包）
        uses: softprops/action-gh-release@v2
        with:
          name: 📦 bixa v${{ github.event.inputs.version }}（composer 构建）（zip 分卷格式）
          tag_name: v${{ github.event.inputs.version }}-composer
          files: |
            chunks/bixa-v${{ github.event.inputs.version }}-composer/*.zip
            chunks/bixa-v${{ github.event.inputs.version }}-composer/manifest.txt
          body: |
            🎉 发布版本：v${{ github.event.inputs.version }}
            📦 文件已按 zip 实际压缩大小高密度打包（最大 ${{ github.event.inputs.max_size_mb || '10' }}MB/包）
            📄 文件清单：manifest.txt
            📥 下载所有 zip 包并解压
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
